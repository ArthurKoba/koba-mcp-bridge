x-observability: &observability
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc
  OTEL_TRACES_EXPORTER: otlp
  OTEL_METRICS_EXPORTER: otlp
  OTEL_LOGS_EXPORTER: otlp
  OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED: "true"

x-infisical: &infisical
  INFISICAL_HOST: ${INFISICAL_HOST}
  INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID}
  INFISICAL_ENVIRONMENT: ${INFISICAL_ENVIRONMENT:-prod}
  INFISICAL_BASE_PATH: ${INFISICAL_BASE_PATH:-/}
  INFISICAL_CLIENT_ID: ${INFISICAL_CLIENT_ID}
  INFISICAL_CLIENT_SECRET: ${INFISICAL_CLIENT_SECRET}
  INFISICAL_VERIFY_TLS: ${INFISICAL_VERIFY_TLS:-true}

x-mcp-service: &mcp-service
  image: ghcr.io/arthurkoba/mcp-bridge:latest
  restart: unless-stopped

services:
  gateway:
    <<: *mcp-service
    expose:
      - "8000"
    command:
      - /app/.venv/bin/opentelemetry-instrument
      - /app/.venv/bin/uvicorn
      - mcp_bridge.server:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment:
      <<: [*observability, *infisical]
      OTEL_SERVICE_NAME: mcp-gateway
      OAUTH_ENABLED: "true"
      OAUTH_BASE_URL: ${OAUTH_BASE_URL:-https://mcp.koba-nexus.ru}
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-mcp.koba-nexus.ru,localhost:*,127.0.0.1:*}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-https://mcp.koba-nexus.ru}
    volumes:
      - fastmcp-data:/data/fastmcp
    depends_on:
      - github-mcp
      - gitlab-mcp
      - files-mcp
      - http-mcp
      - analysis-mcp
      - otel-collector
    networks:
      - default
      - coolify

  github-mcp:
    <<: *mcp-service
    expose:
      - "8000"
    command:
      - /app/.venv/bin/opentelemetry-instrument
      - /app/.venv/bin/uvicorn
      - github_mcp.runtime:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment:
      <<: [*observability, *infisical]
      OTEL_SERVICE_NAME: github-mcp

  gitlab-mcp:
    <<: *mcp-service
    expose:
      - "8000"
    command:
      - /app/.venv/bin/opentelemetry-instrument
      - /app/.venv/bin/uvicorn
      - gitlab_mcp.runtime:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment:
      <<: [*observability, *infisical]
      OTEL_SERVICE_NAME: gitlab-mcp

  files-mcp:
    <<: *mcp-service
    expose:
      - "8000"
    command:
      - /app/.venv/bin/opentelemetry-instrument
      - /app/.venv/bin/uvicorn
      - files_mcp.runtime:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment:
      <<: *observability
      OTEL_SERVICE_NAME: files-mcp
      FILE_ROOT: /files
    volumes:
      - files-data:/files

  http-mcp:
    <<: *mcp-service
    expose:
      - "8000"
    command:
      - /app/.venv/bin/opentelemetry-instrument
      - /app/.venv/bin/uvicorn
      - http_mcp.runtime:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment:
      <<: *observability
      OTEL_SERVICE_NAME: http-mcp
      FILE_ROOT: /files
    volumes:
      - files-data:/files

  analysis-mcp:
    <<: *mcp-service
    expose:
      - "8000"
    command:
      - /app/.venv/bin/opentelemetry-instrument
      - /app/.venv/bin/uvicorn
      - analysis_mcp.runtime:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment:
      <<: *observability
      OTEL_SERVICE_NAME: analysis-mcp
      FILE_ROOT: /files
      GHIDRA_MCP_URL: ${GHIDRA_MCP_URL:-http://bridge:8081/mcp}
    volumes:
      - files-data:/files
    networks:
      - default
      - coolify

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro

volumes:
  files-data:
    external: true
    name: files-data
  fastmcp-data:
    external: true
    name: fastmcp-data

networks:
  coolify:
    external: true
    name: coolify
