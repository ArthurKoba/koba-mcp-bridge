x-infisical: &infisical
  INFISICAL_HOST: ${INFISICAL_HOST}
  INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID}
  INFISICAL_ENVIRONMENT: ${INFISICAL_ENVIRONMENT:-prod}
  INFISICAL_BASE_PATH: ${INFISICAL_BASE_PATH:-/}
  INFISICAL_CLIENT_ID: ${INFISICAL_CLIENT_ID}
  INFISICAL_CLIENT_SECRET: ${INFISICAL_CLIENT_SECRET}
  INFISICAL_VERIFY_TLS: ${INFISICAL_VERIFY_TLS:-true}

x-runtime: &runtime
  image: ghcr.io/arthurkoba/mcp-bridge:latest
  restart: unless-stopped

services:
  gateway:
    <<: *runtime
    expose:
      - "8000"
    command:
      - /app/.venv/bin/uvicorn
      - bridge.server:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment:
      <<: *infisical
      OAUTH_ENABLED: "true"
      OAUTH_BASE_URL: ${OAUTH_BASE_URL:-https://mcp.koba-nexus.ru}
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-mcp.koba-nexus.ru,localhost:*,127.0.0.1:*}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-https://mcp.koba-nexus.ru}
    volumes:
      - fastmcp-data:/data/fastmcp
    depends_on:
      - github
      - gitlab
      - files
      - curl
      - analysis
    networks:
      - default
      - coolify

  github:
    <<: *runtime
    expose:
      - "8000"
    command:
      - /app/.venv/bin/uvicorn
      - modules.github.runtime:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment:
      <<: *infisical

  gitlab:
    <<: *runtime
    expose:
      - "8000"
    command:
      - /app/.venv/bin/uvicorn
      - modules.gitlab.runtime:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment:
      <<: *infisical

  files:
    <<: *runtime
    expose:
      - "8000"
    command:
      - /app/.venv/bin/uvicorn
      - modules.files.runtime:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment:
      FILE_ROOT: /files
    volumes:
      - files-data:/files

  curl:
    <<: *runtime
    expose:
      - "8000"
    command:
      - /app/.venv/bin/uvicorn
      - modules.curl.runtime:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment:
      FILE_ROOT: /files
    volumes:
      - files-data:/files

  analysis:
    <<: *runtime
    expose:
      - "8000"
    command:
      - /app/.venv/bin/uvicorn
      - modules.analysis.runtime:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment:
      FILE_ROOT: /files
      GHIDRA_MCP_URL: ${GHIDRA_MCP_URL:-http://bridge:8081/mcp}
    volumes:
      - files-data:/files
    networks:
      - default
      - coolify

volumes:
  files-data:
    external: true
    name: files-data
  fastmcp-data:
    external: true
    name: fastmcp-data

networks:
  coolify:
    external: true
    name: coolify
