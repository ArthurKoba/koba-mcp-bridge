[project]
name = "koba-mcp-bridge"
version = "0.1.0"
description = "Extensible MCP bridge for local tools, isolated workers, and long-running agent tasks."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "ArthurKoba" }]
dependencies = [
  "fastmcp==4.0.3",
  "mcp[cli]>=2,<3",
  "uvicorn>=0.35,<1",
  "opentelemetry-distro>=0.58b0,<1",
  "opentelemetry-exporter-otlp-proto-grpc>=1.37,<2",
  "opentelemetry-instrumentation-asgi>=0.58b0,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/koba_mcp_bridge"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
