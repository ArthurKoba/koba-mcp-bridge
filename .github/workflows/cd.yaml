name: CD

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: production
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: image
        shell: bash
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    steps:
      - name: Trigger signed deployment
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          DEPLOY_WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
          IMAGE: ${{ needs.publish.outputs.image }}
          REVISION: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import hmac
          import json
          import os
          import urllib.request

          payload = json.dumps(
              {
                  "repository": os.environ["REPOSITORY"],
                  "ref": os.environ["REF"],
                  "sha": os.environ["REVISION"],
                  "image": os.environ["IMAGE"],
              },
              separators=(",", ":"),
          ).encode()
          secret = os.environ["DEPLOY_WEBHOOK_SECRET"].encode()
          signature = "sha256=" + hmac.new(secret, payload, hashlib.sha256).hexdigest()
          request = urllib.request.Request(
              os.environ["DEPLOY_WEBHOOK_URL"],
              data=payload,
              method="POST",
              headers={
                  "Content-Type": "application/json",
                  "X-Hub-Signature-256": signature,
                  "User-Agent": "koba-mcp-bridge-github-actions",
              },
          )
          with urllib.request.urlopen(request, timeout=330) as response:
              body = response.read().decode()
              print(body)
              if response.status != 200:
                  raise SystemExit(f"deployment failed with HTTP {response.status}")
          PY
